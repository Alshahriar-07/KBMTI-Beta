[package]
name = "kbmiti-desktop"
version = "1.0.0"
description = "KBMTI — Kronos BTC Market Intelligence desktop shell"
authors = ["KBMTI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kbmiti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
