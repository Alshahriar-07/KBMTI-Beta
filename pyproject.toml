[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kbmti"
version = "1.2.0"
description = "KBMTI native desktop market intelligence workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7,<6.10",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
kbmti = "kbmti.__main__:main"

[tool.setuptools]
packages = ["kbmti"]

[tool.setuptools.package-data]
kbmti = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["backend/.venv", "apps/desktop/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "kbmti", "patron", "tests"]
